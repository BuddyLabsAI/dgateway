name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3'
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: src/modules/gateway/apps/console-web
      - run: bun install --frozen-lockfile
        working-directory: src/modules/gateway/apps/docs-web
      - run: bun run check
      - run: bun run docs:check
  commits:
    # Commit headers must follow Conventional Commits with the type's gitmoji; see CONTRIBUTING.md.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3'
      - name: Check the pull request commits and title
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          status=0
          bun scripts/commit-msg.ts --range "$BASE..$HEAD" || status=1
          bun scripts/commit-msg.ts --message "$TITLE" || status=1
          exit "$status"
      - name: Check the pushed commits
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          # A new branch or tag has no previous commit, and a force push may have dropped it:
          # then only the head commit is checked.
          if [ "$BEFORE" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            bun scripts/commit-msg.ts --range "$BEFORE..$AFTER"
          else
            bun scripts/commit-msg.ts --commit "$AFTER"
          fi
