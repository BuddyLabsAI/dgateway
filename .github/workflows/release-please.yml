name: Release
on:
  push:
    branches: [main]
permissions:
  contents: write
  pull-requests: write
  actions: write
jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      # Tags created with GITHUB_TOKEN do not start push workflows, but workflow_dispatch does.
      - name: Build the release image
        if: ${{ steps.release.outputs.release_created }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: gh workflow run docker-publish.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG"
