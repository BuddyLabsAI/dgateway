name: Docker image
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  # The release workflow starts this on the new tag: gh workflow run docker-publish.yml --ref v0.2.0
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  docker:
    # A manual run builds only main or a version tag; other refs would have no image tags.
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      # Version tags (pushed, or a workflow_dispatch run on the tag ref): {{version}}, {{major}}.{{minor}}
      # and latest. The semver tags read the version from github.ref_name, so they do not depend on the
      # event type. Pre-releases such as v1.0.0-rc.1 get only {{version}} and never latest.
      # Pushes to main: edge and sha-<short sha>. Pull requests build without pushing.
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/buddylabsai/dgateway
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ github.ref_name }},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{major}}.{{minor}},value=${{ github.ref_name }},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,enable=${{ github.ref == 'refs/heads/main' }}
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
